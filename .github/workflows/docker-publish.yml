name: Pulse Docker Build and Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run Automated Tests
        run: python -m unittest discover -s tests -v

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Publish Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Verify Published Container
        run: |
          docker pull "${IMAGE}:${GITHUB_SHA}"
          docker run -d --name pulse-test -p 8000:8000 "${IMAGE}:${GITHUB_SHA}"
          echo "=== Container Status ==="
          docker ps -a
          success=0
          for attempt in $(seq 1 15); do
            if curl -fsS --max-time 3 http://127.0.0.1:8000/health; then
              success=1
              break
            fi
            echo "Attempt $attempt failed"
            sleep 2
          done
          echo "=== Container Logs ==="
          docker logs pulse-test || true
          if [ "$success" -ne 1 ]; then exit 1; fi
          curl -fsS http://127.0.0.1:8000/version
          docker stop pulse-test
          docker rm pulse-test
